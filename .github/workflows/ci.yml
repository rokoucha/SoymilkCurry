name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Generate version tag
        id: version
        run: echo "version_tag=$(TZ=Asia/Tokyo date +'%Y%m%d.%H%M%S')" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  build:
    needs: [version, check]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            apt_package: ""
            linker: ""
          - target: aarch64-unknown-linux-gnu
            apt_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: armv7-unknown-linux-gnueabihf
            apt_package: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross compiler
        if: matrix.apt_package != ''
        env:
          APT_PACKAGE: ${{ matrix.apt_package }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes "$APT_PACKAGE"

      - name: Add Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Configure linker
        if: matrix.linker != ''
        env:
          LINKER: ${{ matrix.linker }}
          TARGET: ${{ matrix.target }}
        run: |
          target_name=$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_name}_LINKER=$LINKER" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package build result
        env:
          TARGET: ${{ matrix.target }}
          VERSION_TAG: ${{ needs.version.outputs.version_tag }}
        run: |
          archive="soymilk-curry-${VERSION_TAG}-${TARGET}"
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/soymilk-curry" config.example.yml README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"

      - name: Upload build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soymilk-curry-${{ needs.version.outputs.version_tag }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: soymilk-curry-${{ needs.version.outputs.version_tag }}-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum soymilk-curry-*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ needs.version.outputs.version_tag }}
        run: |
          gh release create "$VERSION_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --generate-notes \
            --latest \
            --target "$GITHUB_SHA" \
            --title "$VERSION_TAG"
